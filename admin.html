<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin · Shubhash</title>
<style>body{font:16px Inter,sans-serif;max-width:760px;margin:30px auto;padding:0 16px;background:#faf3e6;color:#3b2418}input,button{font:inherit;padding:10px;margin:4px 0}.c{background:#fff9ee;padding:14px;border-radius:10px;margin:10px 0}button{cursor:pointer;border:0;border-radius:8px;background:#b5532f;color:#fff}.g{background:#24452f}</style>
<h1>Comment moderation</h1><div id="l"><input id="e" type="email" placeholder="Admin email" aria-label="Email"><br><input id="p" type="password" placeholder="Password" aria-label="Password"><br><button id="go">Sign in</button></div><div id="o"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function show(){const{data,error}=await sb.from('comments').select('*').order('created_at',{ascending:false});if(error)return;$('#l').hidden=true;
$('#o').innerHTML=data.map(c=>`<div class="c"><b>${esc(c.name)}</b> · ${c.rating}★ · <i>${c.status}</i><p>${esc(c.comment)}</p><button class="g" data-i="${c.id}" data-a="approved">Approve</button> <button data-i="${c.id}" data-a="rejected">Reject</button> <button data-i="${c.id}" data-a="del">Delete</button></div>`).join('')||'No comments.'}
$('#go').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#e').value,password:$('#p').value});error?alert(error.message):show()};
$('#o').onclick=async e=>{const b=e.target;if(!b.dataset.i)return;b.dataset.a=='del'?await sb.from('comments').delete().eq('id',b.dataset.i):await sb.from('comments').update({status:b.dataset.a}).eq('id',b.dataset.i);show()};show();
</script></html>
